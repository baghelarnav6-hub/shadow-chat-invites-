
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17181b">
  <title>Join ShadowChat</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #17181b;
      color: #f2f3f5;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(340px, 85%);
      padding: 28px;
      border: 1px solid #393d44;
      border-radius: 20px;
      background: #202226;
      text-align: center;
    }
    h1 { letter-spacing: 3px; }
    p { color: #a4a8b0; line-height: 1.6; }
    a {
      display: block;
      margin-top: 22px;
      padding: 15px;
      border-radius: 12px;
      background: #c5c8ce;
      color: #17181b;
      font-weight: bold;
      text-decoration: none;
    }
    #error { color: #ff8a8a; }
  </style>
</head>
<body>
  <main>
    <h1>SHADOWCHAT</h1>
    <p>A private group invitation</p>
    <p id="status">Checking invitation...</p>
    <a id="open" href="#" hidden>Open ShadowChat</a>
    <p id="error"></p>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token");
    const status = document.getElementById("status");
    const open = document.getElementById("open");
    const error = document.getElementById("error");

    if (token && /^[0-9a-f]{64}$/i.test(token)) {
      status.textContent =
        "Your invitation is ready. Open the app to continue.";
      open.href =
        "shadowchat://join?token=" + token.toLowerCase();
      open.hidden = false;
    } else {
      status.textContent = "No valid invitation was found.";
      error.textContent =
        "Ask the group member to send you a new invitation link.";
    }
  </script>
</body>
</html>
